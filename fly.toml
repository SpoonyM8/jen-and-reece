app = 'jen-and-reece'
primary_region = 'syd'
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[[services]]
  internal_port = 80
  auto_stop_machines = "stop"
  auto_start_machines = true
  processes = ["app"]
  protocol = "tcp"
  [services.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

[[statics]]
  guest_path = "/usr/share/nginx/html/"
  url_prefix = "/"